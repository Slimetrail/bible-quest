<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7c3aed"><meta name="robots" content="noindex">
<title>Bible Quest</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<style>#lock{font-family:"Trebuchet MS",system-ui,sans-serif;min-height:100vh;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#fef3c7,#fbcfe8);padding:20px;box-sizing:border-box;text-align:center;color:#1e1b4b}
#lock img{width:110px;border-radius:24px}#lock input{font-size:22px;padding:14px;border-radius:14px;border:3px solid #7c3aed;width:100%;max-width:320px;box-sizing:border-box;margin:10px 0}
#lock button{font-size:20px;font-weight:800;border:0;border-radius:16px;padding:14px;width:100%;max-width:320px;margin:6px 0;color:#fff;background:#22c55e;box-shadow:0 5px 0 #15803d}
#lock #lInstall{background:#22d3ee;color:#083344;box-shadow:0 5px 0 #0e7490}#lErr{color:#dc2626;font-weight:800;min-height:24px}.hide{display:none!important}</style></head>
<body><div id="lock"><img src="icons/icon-192.png" alt=""><h1>📖 Bible Quest</h1><p>Enter the family password</p>
<input id="pw" type="password" autocomplete="current-password" aria-label="Password"><div id="lErr"></div><button id="lGo">🔓 Unlock</button>
<button id="lInstall">📲 Install app</button><div id="lHelp" class="hide">Tap Chrome's <b>⋮</b> menu → <b>Install app</b> / <b>Add to Home screen</b><br><small>(iPhone: Share ⬆️ → Add to Home Screen)</small></div></div>
<script src="loader.js"></script></body></html>
